<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/vendor/htmx.min.js}" defer></script>
</head>
<body>
<ol>
<li th:each="stage : ${ladder.stages}"
    th:classappend="${stage.current ? 'is-current' : 'is-later'}"
    th:attr='data-state=${stage.status == "NOT-STARTED" ? "not-started" : "in-progress"}'>
<span th:text="${stage.percentLabel}">0.0%</span>
<span th:text="${stage.balanceDisplay}">$0.00</span>
</li>
</ol>
</body>
</html>
