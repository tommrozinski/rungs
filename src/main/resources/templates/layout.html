<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">

    <link rel="preload" th:href="@{/fonts/InterVariable.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/rungs.css}">

    <!--/* Pinned htmx 2.0.10 (see static/js/vendor/VERSIONS.md for its SHA-256). */-->

</head>

</noscript>

</html>
