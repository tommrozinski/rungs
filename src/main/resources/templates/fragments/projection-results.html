<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/*
  030: the projection page's results region. view: ProjectionResultsView.
  resultsBody is the #results div's own inner content, used both inline in the full page and, wrapped by
  resultsResponse with the out-of-band value label, as the whole /projection/results fragment response.
*/-->
<div th:fragment="resultsBody(view)">
    <section aria-labelledby="warnings-heading" th:if="${!view.warnings().isEmpty()}">
        <h2 id="warnings-heading" class="visually-hidden">Warnings</h2>
        <div th:each="warning : ${view.warnings()}">
            <div th:replace="~{fragments/warning-banner :: warningBanner(tone='caution', heading=${warning.heading()},
                    message=${warning.message()})}">Warning</div>
        </div>
    </section>

    <section class="stats" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="visually-hidden">Outcome</h2>
        <div th:replace="~{fragments/stat-card :: statCard(label=${view.debtFreeIn().label()},
                figure=${view.debtFreeIn().figure()}, tone=${view.debtFreeIn().tone()})}">Debt-free in</div>
        <div th:replace="~{fragments/stat-card :: statCard(label=${view.totalInterest().label()},
                figure=${view.totalInterest().figure()}, tone=${view.totalInterest().tone()})}">Total interest</div>
        <div th:replace="~{fragments/stat-card :: statCard(label=${view.firstDebtPaidOff().label()},
                figure=${view.firstDebtPaidOff().figure()}, tone=${view.firstDebtPaidOff().tone()})}">First debt
            paid off</div>
    </section>

    <div th:replace="~{fragments/projection-results :: scheduleContainer(schedule=${view.schedule()})}">Schedule</div>
</div>

<!--/* The whole /projection/results response: resultsBody plus the control card's value label, out of band. */-->
<th:block th:fragment="resultsResponse(view)">
    <div th:replace="~{fragments/projection-results :: resultsBody(view=${view})}"></div>
    <span id="extra-payment-value" hx-swap-oob="true" th:text="${view.valueLabel()}">Value label</span>
</th:block>

<!--/* The schedule table, "show all" button, and truncated foot. schedule: ScheduleView. */-->
<div th:fragment="scheduleContainer(schedule)" id="schedule-container">
    <table th:replace="~{fragments/schedule-table :: scheduleTable(caption='Your schedule',
            columns=${schedule.columns()}, rows=${schedule.rows()})}">Schedule</table>
    <p th:if="${schedule.truncated()}">This plan doesn't finish within 360 months.</p>
    <button th:if="${schedule.showAllButton()}" type="button" class="btn btn-secondary"
            hx-post="/projection/schedule" hx-include="#projection-controls" hx-target="#schedule-container"
            hx-swap="outerHTML" th:text="${schedule.showAllLabel()}">Show all</button>
</div>

<!--/* A small caution fragment for a 400 response on /projection/results or /projection/schedule. */-->
<div th:fragment="invalid" role="alert">
    <div th:replace="~{fragments/warning-banner :: warningBanner(tone='problem', heading='Could not update your plan',
            message='Check your numbers and try again.')}">Invalid</div>
</div>
</body>
</html>
