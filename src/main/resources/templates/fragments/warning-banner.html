<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/* C-09 warning banner. tone: caution (warnings) | problem (validation summaries and failed imports only). */-->
<div th:fragment="warningBanner(tone, heading, message)" class="banner"
     th:classappend="${tone == 'problem'} ? 'banner-problem' : 'banner-caution'">
    <span class="banner-mark" aria-hidden="true">!</span>
    <div>
        <p class="banner-heading" th:text="${heading}">Heading</p>
        <p class="banner-message" th:text="${message}">Message</p>
    </div>
</div>
</body>
</html>
