<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/*
  C-06 stage row. row: StageRowView. The current row expands with the blocker, progress bar and call to action.
  Optional hiddenFields: a fragment expression placed inside the call-to-action form, such as the snapshot fields.
*/-->
<li th:fragment="stageRow(row)" class="stage"
    th:classappend="${row.current} ? 'is-expanded' : ''"
    th:aria-current="${row.current} ? 'step'">
    <span class="disc"
          th:classappend="${row.status == 'SATISFIED'} ? 'disc-satisfied' : (${row.status == 'IN_PROGRESS'} ? 'disc-in-progress' : (${row.status == 'SKIPPED'} ? 'disc-skipped' : 'disc-not-started'))">
        <span aria-hidden="true" th:text="${row.discGlyph}">1</span>
        <span class="visually-hidden" th:text="${row.stageLabel}">Stage 1</span>
    </span>
    <div class="stage-body">
        <div class="stage-head">
            <h3 class="stage-title" th:text="${row.title}">Title</h3>
            <span th:replace="~{fragments/status-chip :: statusChip(status=${row.status}, label=${row.chipLabel})}">Chip</span>
        </div>
        <p class="stage-reason" th:unless="${row.current}" th:text="${row.reason}">Reason</p>
        <div class="stage-open" th:if="${row.current}">
            <p class="blocker" th:text="${row.reason}">Blocker</p>
            <div th:replace="~{fragments/progress-bar :: progressBar(percent=${row.percentComplete},
                    width=${row.progressWidth}, complete=${row.progressComplete}, label=${row.title})}">Progress</div>
            <form class="stage-cta" method="post" th:action="@{${row.ctaAction}}">
                <th:block th:if="${hiddenFields != null}">
                    <th:block th:replace="${hiddenFields}"></th:block>
                </th:block>
                <button th:replace="~{fragments/button :: button(label=${row.ctaLabel}, type='submit',
                        variant='primary', state='', disabled=false)}">Action</button>
            </form>
        </div>
    </div>
</li>
</body>
</html>
