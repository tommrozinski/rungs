<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--/* C-08 stat card. tone: neutral | positive. The figure arrives formatted by the server. */-->
<div th:fragment="statCard(label, figure, tone)" class="stat"
     th:classappend="${tone == 'positive'} ? 'is-positive' : ''">
    <p class="stat-label" th:text="${label}">Label</p>
    <p class="stat-figure num" th:text="${figure}">$0.00</p>
</div>
</body>
</html>
