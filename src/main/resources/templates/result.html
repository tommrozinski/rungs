<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rungs — Your results</title>
<link rel="stylesheet" href="/css/rungs.css">
</head>
<body>

  <div class="appbar">
    <div class="wordmark"><span class="glyph">R</span> Rungs</div>
    <nav><a href="/">Snapshot</a><span class="on">Results</span></nav>
  </div>

  <div class="screen">

    <div class="verdict">
      <p class="eyebrow" th:utext="${result.eyebrow}"></p>
      <p class="line" th:utext="${result.verdictLine}"></p>
      <p class="sub" th:utext="${result.verdictSub}"></p>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="k">Monthly surplus</div><div class="v num" th:classappend="${result.surplusPositive} ? 'pos' : null" th:text="${result.monthlySurplus}"></div></div>
      <div class="stat"><div class="k">Non-mortgage debt</div><div class="v num" th:text="${result.nonMortgageDebt}"></div></div>
      <div class="stat"><div class="k">Stages complete</div><div class="v num" th:text="${result.stagesComplete}"></div></div>
    </div>

    <h2 class="h2" style="margin-bottom:14px;">Your seven stages</h2>
    <div class="ladder">

      <div class="stage" th:each="s : ${result.stages}">
        <div class="disc" th:classappend="${s.discClass}" th:text="${s.discContent}"></div>

        <div class="stage-body" th:unless="${s.open}">
          <div class="stage-title"><span th:utext="${s.title}"></span><span class="chip" th:classappend="${s.chipClass}" th:utext="${s.chipLabel}"></span></div>
          <div class="bar" th:if="${s.showBar}"><i th:style="'width:' + ${s.barWidthPercent} + '%'"></i></div>
          <div class="small" th:style="${s.showBar} ? 'margin-top:6px;' : null" th:utext="${s.line}"></div>
        </div>

        <div class="stage-body" style="padding-top:0" th:if="${s.open}">
          <div class="stage-open">
            <div class="stage-title"><span th:utext="${s.title}"></span><span class="chip" th:classappend="${s.chipClass}" th:utext="${s.chipLabel}"></span></div>
            <p class="blocker" th:classappend="${s.showBar} ? null : 'last'" th:utext="${s.line}"></p>
            <div class="bar" th:if="${s.showBar}"><i th:style="'width:' + ${s.barWidthPercent} + '%'"></i></div>
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
