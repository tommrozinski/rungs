<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(title=${page.documentTitle()})}"></head>
<body>
<div th:replace="~{layout :: noscript}"></div>
<main class="assessment-page">
    <h1>Your stage</h1>

    <section th:replace="~{fragments/verdict :: verdict(view=${page.verdict()})}">Verdict</section>

    <section class="stats" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="visually-hidden">Your numbers</h2>
        <div th:replace="~{fragments/stat-card :: statCard(label=${page.surplus().label()},
                figure=${page.surplus().figure()}, tone=${page.surplus().tone()})}">Monthly surplus</div>
        <div th:replace="~{fragments/stat-card :: statCard(label=${page.totalDebt().label()},
                figure=${page.totalDebt().figure()}, tone=${page.totalDebt().tone()})}">Total debt</div>
        <div th:replace="~{fragments/stat-card :: statCard(label=${page.emergencyFund().label()},
                figure=${page.emergencyFund().figure()}, tone=${page.emergencyFund().tone()})}">Emergency fund</div>
    </section>

    <section aria-labelledby="warnings-heading" th:if="${!page.warnings().isEmpty()}">
        <h2 id="warnings-heading" class="visually-hidden">Warnings</h2>
        <div th:each="warning : ${page.warnings()}">
            <div th:replace="~{fragments/warning-banner :: warningBanner(tone='caution', heading=${warning.heading()},
                    message=${warning.message()})}">Warning</div>
        </div>
    </section>

    <section aria-labelledby="ladder-heading">
        <h2 id="ladder-heading">Your stage ladder</h2>
        <ol th:replace="~{fragments/stage-ladder :: stageLadder(rows=${page.ladder()},
                hiddenFields=~{fragments/hidden-snapshot :: hiddenSnapshot(fields=${page.hiddenFields()})})}">Ladder</ol>
    </section>
</main>
</body>
</html>
