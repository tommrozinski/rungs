spring.application.name=rungs

# The snapshot form has ~115 fields (13 top-level plus up to 20 debt rows of 5 fields each); either limit rejects a
# request before its body is fully buffered in memory, so a hostile oversized or field-flooded POST cannot exhaust
# the server. Tomcat answers a request over the post-size limit with a 413, and one over the parameter-count limit
# with a 400 — never a 500.
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-parameter-count=300

# This app has no file uploads, and Spring's multipart request parsing is a separate code path from the
# url-encoded form parsing the two limits above constrain: left at its default (enabled, 10MB), a multipart POST
# would still bind SnapshotForm's fields while bypassing both limits above. Disabling it entirely closes that gap;
# any multipart request to /assess is then either rejected or has its body ignored, never bound.
spring.servlet.multipart.enabled=false

# We render our own templates/error.html instead of Boot's default whitelabel page.
server.error.whitelabel.enabled=false
